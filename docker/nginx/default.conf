# ═══════════════════════════════════════════════════════════════════════════
#  nginx — SPA + reverse proxy
# ═══════════════════════════════════════════════════════════════════════════
#
#  The client calls `/api/v1/...`. nginx forwards that to the API WITHOUT
#  stripping a prefix, because this API is globally prefixed `api` and
#  URI-versioned `v1`: a controller at `@Controller('investigations')` is
#  reachable at `/api/v1/investigations`. That is a deliberate difference from
#  the sibling Collex system, whose nginx strips `/api/`. Do not copy the strip
#  across — it turns every route into a 404.
# ═══════════════════════════════════════════════════════════════════════════

upstream api_backend {
    server api:5100;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads go straight to object storage over a presigned URL, so nothing
    # large flows through here — except an Excel import, which does.
    client_max_body_size 25m;

    # Chrome will not enable a spreadsheet download without this on the proxy.
    proxy_http_version 1.1;

    # ── Security headers ───────────────────────────────────────────────────
    # No CSP is set here. A meaningful policy has to name the storage origin
    # and the realtime origin, both of which are deployment-specific; a
    # permissive placeholder would read as protection that is not there.
    # `docs/deployment.md` carries the policy to paste in once those are known.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # ── nginx's own liveness ───────────────────────────────────────────────
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API ────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # A PDF export or a large import can outlast the 60s default.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Streamed downloads must not sit in a buffer until complete.
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://api_backend/health;
        access_log off;
        proxy_set_header Host $host;
    }

    location = /readiness {
        proxy_pass http://api_backend/readiness;
        access_log off;
        proxy_set_header Host $host;
    }

    # ── Socket.IO ──────────────────────────────────────────────────────────
    # The Upgrade headers are what make this a WebSocket rather than a very
    # patient long-poll. A missing `proxy_set_header Upgrade` does not error —
    # socket.io silently falls back to polling and nobody notices until the
    # notification latency is measured.
    location /realtime/ {
        proxy_pass http://api_backend;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── Static assets ──────────────────────────────────────────────────────
    # Vite fingerprints every filename, so a year is safe and a redeploy is
    # picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── The SPA ────────────────────────────────────────────────────────────
    # index.html itself is never cached: it is the file that names the current
    # asset hashes, and a stale copy points at bundles that no longer exist.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;
}
