<!doctype html>
<!--
  `lang` and `dir` are placeholders. `src/i18n/index.js` sets them from the
  stored language on boot, before React renders, so the first paint is already
  in the right direction — a page that renders left-to-right and then flips is
  visibly broken for the moment it takes.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fb" />
    <!--
      Set the colour theme before anything paints, or a dark-mode user sees a
      white flash on every load. Mirrors `resolve()` in src/theme/index.js.
    -->
    <script>
      (function () {
        var p = 'system';
        try { p = localStorage.getItem('collex-inq-theme') || 'system'; } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <meta
      name="description"
      content="Collex Inquiries — Field Investigation Management System"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Collex Inquiries</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
